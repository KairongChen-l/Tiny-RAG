# Ollama 本地测试配置（无需 API Key）
# 使用方法: make run-config CONFIG=./configs/config-ollama.yaml
# 或者: go run ./cmd/server -config ./configs/config-ollama.yaml
#
# 前置要求:
# 1. 启动 Ollama: ollama serve
# 2. 下载模型: ollama pull nomic-embed-text
# 3. 下载模型: ollama pull llama3.2
# 4. 启动 Qdrant: docker-compose up -d qdrant

server:
  port: 8080
  read_timeout: 60s
  write_timeout: 300s  # Ollama 响应可能很慢，特别是首次加载模型时
  rate_limit:
    enabled: false
    rate: 100
    burst: 100
    window: "1s"
  performance:
    slow_query_threshold: "1s"
    enable_tracing: false
    log_slow_queries: true

database:
  provider: "qdrant"
  qdrant:
    url: "http://localhost:6333"
    collection: "rag_chunks_ollama"
    api_key: ""
  path: "./data/rag-ollama.db"  # 仅用于 job 存储

job:
  workers: 2
  queue_size: 50

embedding:
  provider: "ollama"  # 使用 Ollama 本地 embedding
  batch_size: 10      # Ollama 批量处理较慢，减小批量大小
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"  # 需要先运行: ollama pull nomic-embed-text
    dimensions: 768

llm:
  default_provider: "ollama"  # 使用 Ollama 本地 LLM
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"  # 需要先运行: ollama pull llama3.2

chunking:
  max_size: 800
  min_size: 100
  overlap: 100
  respect_bounds: true

retrieval:
  default_top_k: 3      # Ollama 较慢，减少检索数量
  candidate_k: 10
  min_score: 0.5        # 降低阈值以获得更多结果
  enable_rerank: false
  enable_hybrid: false
  enable_query_rewrite: false
  enable_query_expand: false
  use_llm_rewriter: false
  multi_query_count: 0
  fusion_method: "rrf"
  rrf_k: 60

prompt:
  max_context_tokens: 1000  # Ollama 模型上下文通常较小，进一步减少以确保稳定性
  include_citations: true

