# 默认配置：Kimi LLM + Ollama Embedding
# 使用方法: go run ./cmd/server
# 或者: make run

server:
  port: 8080
  read_timeout: 60s
  write_timeout: 120s
  rate_limit:
    enabled: false
    rate: 100
    burst: 100
    window: "1s"
  performance:
    slow_query_threshold: "1s"
    enable_tracing: false
    log_slow_queries: true

database:
  provider: "qdrant"
  path: "./data/rag.db"  # 仅用于 job 存储
  qdrant:
    url: "http://localhost:6333"
    collection: "rag_chunks"
    api_key: ""

job:
  workers: 3
  queue_size: 100

embedding:
  provider: "ollama"  # 使用 Ollama 本地 embedding
  batch_size: 10
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"  # 需要先运行: ollama pull nomic-embed-text
    dimensions: 768

llm:
  default_provider: "kimi"  # 使用 Kimi API
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"  # 需要先运行: ollama pull llama3.2
  kimi:
    api_key: "sk-Txs391LxYSysyie8TXa3BfljTp9GNXQBtCYVZ7kQX0QiUj9r"
    model: "moonshot-v1-8k"  # 可选: moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k
    max_tokens: 4096
    temperature: 0.7
    base_url: "https://api.moonshot.cn/v1"

chunking:
  max_size: 1000
  min_size: 100
  overlap: 100
  respect_bounds: true

retrieval:
  default_top_k: 5
  candidate_k: 20
  min_score: 0.7
  enable_rerank: false
  enable_hybrid: false
  enable_query_rewrite: false
  enable_query_expand: false
  use_llm_rewriter: false
  multi_query_count: 0
  fusion_method: "rrf"
  rrf_k: 60

prompt:
  max_context_tokens: 3000
  include_citations: true

