server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

database:
  path: "./data/rag.db"

job:
  workers: 3
  queue_size: 100

embedding:
  provider: "openai"  # or "ollama"
  batch_size: 100
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "text-embedding-3-small"
    dimensions: 1536
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"
    dimensions: 768

llm:
  default_provider: "openai"
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    max_tokens: 2048
    temperature: 0.7
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    max_tokens: 2048
  ollama:
    base_url: "http://localhost:11434"
    model: "llama2"

chunking:
  max_size: 1000
  min_size: 100
  overlap: 100
  respect_bounds: true

retrieval:
  default_top_k: 5
  candidate_k: 20
  min_score: 0.7
  enable_rerank: false

prompt:
  max_context_tokens: 3000
  include_citations: true

