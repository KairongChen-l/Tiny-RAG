server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

database:
  path: "./data/rag.db"

job:
  workers: 3
  queue_size: 100

embedding:
  provider: "openai"  # or "ollama"
  batch_size: 100
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "text-embedding-3-small"
    dimensions: 1536
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"
    dimensions: 768

llm:
  default_provider: "kimi"
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    max_tokens: 2048
    temperature: 0.7
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    max_tokens: 2048
  ollama:
    base_url: "http://localhost:11434"
    model: "llama2"
  kimi:
    api_key: "sk-Txs391LxYSysyie8TXa3BfljTp9GNXQBtCYVZ7kQX0QiUj9r"
    model: "moonshot-v1-8k"  # 可选: moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k
    max_tokens: 4096
    temperature: 0.7
    base_url: "https://api.moonshot.cn/v1"

chunking:
  max_size: 1000
  min_size: 100
  overlap: 100
  respect_bounds: true

retrieval:
  default_top_k: 5
  candidate_k: 20
  min_score: 0.7
  enable_rerank: false
  enable_hybrid: false
  enable_query_rewrite: false
  enable_query_expand: false
  use_llm_rewriter: false
  multi_query_count: 0
  fusion_method: "rrf"
  rrf_k: 60
  cohere:
    api_key: "${COHERE_API_KEY}"
    model: "rerank-multilingual-v3.0"
    top_n: 10

prompt:
  max_context_tokens: 3000
  include_citations: true

