<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库测试</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 166, 255, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(163, 113, 247, 0.1), transparent);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.checking { background: var(--accent-yellow); }
        .status-dot.online { background: var(--accent-green); }
        .status-dot.offline { background: var(--accent-red); }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card-header .icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 10px;
            font-size: 1.25rem;
        }
        
        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.05);
        }
        
        .upload-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .upload-zone p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .upload-zone .formats {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }
        
        .file-item .remove {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent-blue);
        }
        
        .query-input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 1rem;
        }
        
        .query-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        
        .query-input::placeholder {
            color: var(--text-secondary);
        }
        
        .response-area {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1.5rem;
            min-height: 200px;
            margin-top: 1rem;
        }
        
        .response-area.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .response-area .answer {
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .response-area .answer .citation {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            background: var(--accent-purple);
            color: white;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .response-area .answer .citation:hover {
            transform: scale(1.1);
        }
        
        .citations {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        
        .citations h4 {
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .citation-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .citation-item .header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .citation-item .badge {
            background: var(--accent-purple);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .citation-item .source {
            color: var(--accent-blue);
            font-size: 0.85rem;
        }
        
        .citation-item .preview {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateX(calc(100% + 2rem));
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--accent-red); }
        .toast.info { border-left: 4px solid var(--accent-blue); }
        
        .job-status {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }
        
        .job-status .progress-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .job-status .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }
        
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 RAG 知识库</h1>
            <p>上传文档，智能问答</p>
        </header>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot checking" id="api-status"></span>
                <span>API: <span id="api-status-text">检查中...</span></span>
            </div>
            <div class="status-item">
                <span class="status-dot checking" id="embedding-status"></span>
                <span>Embedding: <span id="embedding-status-text">检查中...</span></span>
            </div>
            <div class="status-item">
                <span class="status-dot checking" id="llm-status"></span>
                <span>LLM: <span id="llm-status-text">检查中...</span></span>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- 上传文档 -->
            <div class="card">
                <div class="card-header">
                    <div class="icon">📄</div>
                    <h2>上传文档</h2>
                </div>
                
                <div class="upload-zone" id="upload-zone">
                    <div class="icon">📁</div>
                    <p>拖拽文件到此处，或点击选择</p>
                    <p class="formats">.md .txt 支持中</p>
                    <input type="file" id="file-input" multiple accept=".md,.txt,.pdf">
                </div>
                
                <div class="file-list" id="file-list"></div>
                
                <button class="btn btn-primary" id="upload-btn" disabled>
                    <span>📤</span> 上传文档
                </button>
                
                <div class="job-status" id="job-status" style="display: none;">
                    <div>状态: <span id="job-status-text">pending</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="job-progress" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <!-- 知识问答 -->
            <div class="card">
                <div class="card-header">
                    <div class="icon">💬</div>
                    <h2>知识问答</h2>
                </div>
                
                <textarea class="query-input" id="query-input" placeholder="输入你的问题，例如：RAG 是什么？Go 语言的核心特性有哪些？"></textarea>
                
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-primary" id="query-btn">
                        <span>🚀</span> 提问
                    </button>
                    <button class="btn btn-secondary" id="clear-btn">
                        <span>🗑️</span> 清空
                    </button>
                </div>
                
                <div class="response-area" id="response-area">
                    <div class="empty-state">
                        <div class="icon">💡</div>
                        <p>输入问题，开始智能问答</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast">
        <span class="icon"></span>
        <span class="message"></span>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        let selectedFiles = [];
        
        // DOM Elements
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const uploadBtn = document.getElementById('upload-btn');
        const jobStatus = document.getElementById('job-status');
        const jobStatusText = document.getElementById('job-status-text');
        const jobProgress = document.getElementById('job-progress');
        const queryInput = document.getElementById('query-input');
        const queryBtn = document.getElementById('query-btn');
        const clearBtn = document.getElementById('clear-btn');
        const responseArea = document.getElementById('response-area');
        
        // Check API health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                updateStatus('api', response.ok ? 'online' : 'offline', response.ok ? '正常' : '离线');
                
                if (data.components) {
                    updateStatus('embedding', 
                        data.components.embedding === 'ok' ? 'online' : 'offline',
                        data.components.embedding === 'ok' ? '正常' : '未配置');
                    updateStatus('llm',
                        data.components.llm === 'ok' ? 'online' : 'offline',
                        data.components.llm === 'ok' ? '正常' : '未配置');
                }
            } catch (e) {
                updateStatus('api', 'offline', '无法连接');
                updateStatus('embedding', 'offline', '未知');
                updateStatus('llm', 'offline', '未知');
            }
        }
        
        function updateStatus(component, status, text) {
            document.getElementById(`${component}-status`).className = `status-dot ${status}`;
            document.getElementById(`${component}-status-text`).textContent = text;
        }
        
        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            toast.querySelector('.icon').textContent = icons[type];
            toast.querySelector('.message').textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // File upload handling
        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        function handleFiles(files) {
            for (const file of files) {
                if (!selectedFiles.find(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            }
            renderFileList();
        }
        
        function renderFileList() {
            fileList.innerHTML = selectedFiles.map((file, i) => `
                <div class="file-item">
                    <span>📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                    <button class="remove" onclick="removeFile(${i})">×</button>
                </div>
            `).join('');
            uploadBtn.disabled = selectedFiles.length === 0;
        }
        
        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        };
        
        // Upload files
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            
            uploadBtn.disabled = true;
            
            for (const file of selectedFiles) {
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch(`${API_BASE}/documents`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showToast(`文档 ${file.name} 提交成功`, 'success');
                        if (data.job_id) {
                            pollJobStatus(data.job_id);
                        }
                    } else {
                        showToast(`上传失败: ${data.error?.message || '未知错误'}`, 'error');
                    }
                } catch (e) {
                    showToast(`上传失败: ${e.message}`, 'error');
                }
            }
            
            selectedFiles = [];
            renderFileList();
        });
        
        // Poll job status
        async function pollJobStatus(jobId) {
            jobStatus.style.display = 'block';
            jobStatusText.textContent = 'pending';
            jobProgress.style.width = '0%';
            
            const poll = async () => {
                try {
                    const response = await fetch(`${API_BASE}/jobs/${jobId}`);
                    const data = await response.json();
                    
                    jobStatusText.textContent = data.status;
                    jobProgress.style.width = `${data.progress || 0}%`;
                    
                    if (data.status === 'completed') {
                        showToast('文档处理完成！', 'success');
                        setTimeout(() => jobStatus.style.display = 'none', 2000);
                    } else if (data.status === 'failed') {
                        showToast(`处理失败: ${data.error}`, 'error');
                        setTimeout(() => jobStatus.style.display = 'none', 2000);
                    } else {
                        setTimeout(poll, 1000);
                    }
                } catch (e) {
                    showToast(`查询状态失败: ${e.message}`, 'error');
                }
            };
            
            poll();
        }
        
        // Query
        queryBtn.addEventListener('click', async () => {
            const query = queryInput.value.trim();
            if (!query) {
                showToast('请输入问题', 'info');
                return;
            }
            
            queryBtn.disabled = true;
            responseArea.innerHTML = '<div class="spinner"></div>';
            responseArea.classList.add('loading');
            
            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    renderResponse(data);
                } else {
                    responseArea.innerHTML = `<div class="empty-state">
                        <div class="icon">❌</div>
                        <p>查询失败: ${data.error?.message || '未知错误'}</p>
                    </div>`;
                }
            } catch (e) {
                responseArea.innerHTML = `<div class="empty-state">
                    <div class="icon">❌</div>
                    <p>请求失败: ${e.message}</p>
                </div>`;
            } finally {
                queryBtn.disabled = false;
                responseArea.classList.remove('loading');
            }
        });
        
        function renderResponse(data) {
            // 处理答案中的引用标记
            let answer = data.answer || '暂无回答';
            answer = answer.replace(/\[citation:(\d+)\]/g, '<span class="citation" data-id="$1">[$1]</span>');
            
            let html = `<div class="answer">${answer}</div>`;
            
            if (data.citations && data.citations.length > 0) {
                html += `<div class="citations">
                    <h4>📚 参考来源</h4>
                    ${data.citations.map(c => `
                        <div class="citation-item" id="citation-${c.id}">
                            <div class="header">
                                <span class="badge">[${c.id}]</span>
                                <span class="source">${c.source || '未知来源'}${c.section ? ' > ' + c.section : ''}</span>
                            </div>
                            <div class="preview">${c.preview || ''}</div>
                        </div>
                    `).join('')}
                </div>`;
            }
            
            responseArea.innerHTML = html;
            
            // 点击引用滚动到对应来源
            responseArea.querySelectorAll('.citation').forEach(el => {
                el.addEventListener('click', () => {
                    const target = document.getElementById(`citation-${el.dataset.id}`);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.style.borderColor = 'var(--accent-purple)';
                        setTimeout(() => target.style.borderColor = '', 1000);
                    }
                });
            });
        }
        
        // Clear response
        clearBtn.addEventListener('click', () => {
            queryInput.value = '';
            responseArea.innerHTML = `<div class="empty-state">
                <div class="icon">💡</div>
                <p>输入问题，开始智能问答</p>
            </div>`;
        });
        
        // Ctrl+Enter to submit
        queryInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                queryBtn.click();
            }
        });
        
        // Initial health check
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
